# One-off: regenerates the visual baselines in the pinned container and commits them to this branch.
name: Visual baselines

on:
  push:
    branches:
      - claude/growth-frontend-izet59

permissions:
  contents: write

jobs:
  update:
    if: contains(github.event.head_commit.message, '[visual-baselines]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: frontend/.nvmrc

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: frontend
        run: VITE_GROWTH_API=mock pnpm run build

      - name: Update snapshots
        working-directory: frontend
        run: E2E_VISUAL=1 E2E_VISUAL_CONTAINER=1 npx playwright test -c e2e/playwright.config.ts --update-snapshots=all

      - name: Commit baselines
        if: always()
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/e2e/specs/visual
          git commit -m "frontend: regenerate visual baselines in the pinned container" || exit 0
          git push origin HEAD:${GITHUB_REF_NAME}
